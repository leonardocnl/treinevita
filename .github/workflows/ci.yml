name: CI

on:
    push:
        branches: [main, develop]
    pull_request:

jobs:
    quality:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - run: npm ci
            - run: npm run check:format
            - run: npm run lint
            - run: npm run check:architecture
            - run: npm run check:types
            - run: npm run test
            - run: npm run build
